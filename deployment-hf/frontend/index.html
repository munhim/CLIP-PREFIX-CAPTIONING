<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIP Captioning - Image Caption Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 CLIP Image Caption Generator</h1>
            <p>Upload an image and get an AI-generated caption</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-content">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <h3>Drag & Drop your image here</h3>
                        <p>or click to browse</p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                    </div>
                </div>

                <div class="url-section">
                    <p class="divider">OR</p>
                    <div class="url-input-group">
                        <input type="url" id="urlInput" placeholder="Enter image URL (e.g., https://example.com/image.jpg)">
                        <button id="urlSubmitBtn" class="btn btn-primary">Generate from URL</button>
                    </div>
                </div>
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="image-preview">
                    <img id="previewImage" src="" alt="Preview">
                    <button class="close-btn" id="closePreview">×</button>
                </div>
                <button id="generateBtn" class="btn btn-primary btn-large">
                    <span id="generateBtnText">Generate Caption</span>
                    <span id="generateBtnLoader" class="loader" style="display: none;"></span>
                </button>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h3>Generated Caption:</h3>
                <div class="caption-box">
                    <p id="captionText"></p>
                    <button class="copy-btn" id="copyBtn" title="Copy caption">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <div class="caption-info" id="captionInfo"></div>
            </div>

            <div class="error-section" id="errorSection" style="display: none;">
                <div class="error-box">
                    <span class="error-icon">⚠️</span>
                    <p id="errorText"></p>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by CLIP + GPT-2 | Model: Hamza66628/clip-prefix-caption-coco</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
